services:
  sidago-postgres:
    image: postgres:16-alpine
    container_name: sidago-postgres
    environment:
      POSTGRES_DB: sidago_strapi
      POSTGRES_USER: sidago
      POSTGRES_PASSWORD: sidago
    ports:
      - "5432:5432"
    volumes:
      - sidago-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidago -d sidago_strapi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  sidago-strapi:
    build:
      context: ./strapi
      dockerfile: Dockerfile
    container_name: sidago-strapi
    env_file:
      - ./strapi/.env
    depends_on:
      sidago-postgres:
        condition: service_healthy
    ports:
      - "9001:9001"
    restart: always

  # sidago-frontend:
