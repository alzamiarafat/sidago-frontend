name: sidago-nextjs-frontend

services:
  sidago-nextjs-frontend:
    image: sidago-nextjs-frontend:${IMAGE_TAG:-1}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL}
        STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
    container_name: sidago-nextjs-frontend
    env_file:
      - .env
    ports:
      - "9010:9010"
    restart: always
